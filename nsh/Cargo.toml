[package]
name = "nsh-app-editor"
version = "0.3.2"
edition = "2024"
description = "editor on NSH: the same core, drawn with each platform's native views."
license = "MIT"
publish = false

# The program is nsvim. The library keeps the crate name, which the tests import.
[[bin]]
name = "nsvim"
path = "src/main.rs"

[dependencies]
nsh-icon-lucide = "0.1.0"
nsh-icon = "0.1.0"
editor = { package = "editor-core", path = "../crates/editor-core" }
nsh-core = "0.7.0"
nsh-base = "0.7.0"
unicode-width = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
dirs = "6"
globset = "0.4"
similar = "2"
# The workers wake the engine thread through a tokio channel, which any executor can await.
tokio = { version = "1", default-features = false, features = ["sync"] }

# The workers that walk and watch the disk, and the log. The web build has none of them.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
env_logger = "0.11"
ignore = "0.4"
notify = "8"

[target.'cfg(target_os = "linux")'.dependencies]
nsh-platform-linux = { version = "0.7.0", default-features = false, features = ["svg"] }

[target.'cfg(target_os = "macos")'.dependencies]
nsh-platform-macos = { version = "0.7.0", default-features = false, features = ["svg"] }

[target.'cfg(target_os = "windows")'.dependencies]
nsh-platform-windows = { version = "0.7.0", default-features = false, features = ["svg"] }

[dev-dependencies]
nsh-engine = { version = "0.7.0", default-features = false }
nsh-testing = { version = "0.7.0", default-features = false }
tempfile = "3"
