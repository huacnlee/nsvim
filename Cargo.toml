# nsvim's Rust: the app's nshm (ext/nsvim-native) and its editing core (ext/editor-core).
[workspace]
members = ["ext/nsvim-native", "ext/editor-core"]
default-members = ["ext/nsvim-native", "ext/editor-core"]
resolver = "3"

[profile.dev]
debug = "line-tables-only"

# Dependencies build optimized, so a debug build of the app still types fast.
[profile.dev.package."*"]
opt-level = 2
debug = false

# The shipped build: one codegen unit and link-time optimization across every crate. Symbols are
# stripped. For quick local release builds, use `cargo build --profile quick`.
[profile.release]
codegen-units = 1
lto = "fat"
incremental = false
strip = "symbols"

[profile.quick]
inherits = "release"
codegen-units = 16
lto = false
incremental = true
strip = false
