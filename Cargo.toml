[package]
name = "editor"
version = "0.3.2"
edition = "2024"
description = "A lightweight modal editor for reading code fast and making quick edits, built on Rune."
license = "MIT"

[[bin]]
name = "editor"
path = "src/main.rs"

[workspace]
members = [".", "crates/editor-core"]
# The NSH port builds as its own workspace (nsh/Cargo.toml).
exclude = ["nsh"]

[dependencies]
editor = { package = "editor-core", path = "crates/editor-core" }
rune = { git = "https://github.com/anomalyco/rune", rev = "bf3f9d4a0459af5071cd352df816b610dda7f3a6" }
rune-highlights = { git = "https://github.com/anomalyco/rune", rev = "bf3f9d4a0459af5071cd352df816b610dda7f3a6" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
dirs = "6"
ignore = "0.4"
globset = "0.4"
notify = "8"
similar = "2"
unicode-width = "0.2"
unicode-segmentation = "1"

[dev-dependencies]
tempfile = "3"

# A dependency's patches do not apply to the workspace that uses it, so an app that builds Rune
# patches these crates itself, at the same Rune revision.
[patch.crates-io]
wgpu-hal = { git = "https://github.com/anomalyco/rune", rev = "bf3f9d4a0459af5071cd352df816b610dda7f3a6" }
winit = { git = "https://github.com/anomalyco/rune", rev = "bf3f9d4a0459af5071cd352df816b610dda7f3a6" }
parley_engine = { git = "https://github.com/anomalyco/rune", rev = "bf3f9d4a0459af5071cd352df816b610dda7f3a6" }
accesskit_windows = { git = "https://github.com/anomalyco/rune", rev = "bf3f9d4a0459af5071cd352df816b610dda7f3a6" }

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
debug = false

# The shipped build: one codegen unit and link-time optimization across every crate, so hot
# paths inline through Rune, ropey and tree-sitter. Symbols are stripped. For quick local
# release builds, use `cargo build --profile quick`.
[profile.release]
codegen-units = 1
lto = "fat"
incremental = false
strip = "symbols"

[profile.quick]
inherits = "release"
codegen-units = 16
lto = false
incremental = true
strip = false
