name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        # `builds` lists target:archive-name pairs. Both macOS targets build in one job, so a
        # release waits for one macOS runner, not two.
        include:
          - { os: ubuntu-24.04, name: x86_64-linux, targets: x86_64-unknown-linux-gnu, builds: "x86_64-unknown-linux-gnu:x86_64-linux" }
          - { os: ubuntu-24.04-arm, name: aarch64-linux, targets: aarch64-unknown-linux-gnu, builds: "aarch64-unknown-linux-gnu:aarch64-linux" }
          - { os: macos-latest, name: macos, targets: "aarch64-apple-darwin,x86_64-apple-darwin", builds: "aarch64-apple-darwin:aarch64-macos x86_64-apple-darwin:x86_64-macos" }
          - { os: windows-latest, name: x86_64-windows, targets: x86_64-pc-windows-msvc, builds: "x86_64-pc-windows-msvc:x86_64-windows" }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Linux packages
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev pkg-config
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.1"
          targets: ${{ matrix.targets }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}
      - name: Build and package
        shell: bash
        run: |
          for pair in ${{ matrix.builds }}; do
            target="${pair%%:*}"
            name="${pair##*:}"
            cargo build --release --locked --target "$target"
            dir="nsvim-${GITHUB_REF_NAME}-$name"
            mkdir "$dir"
            exe=nsvim
            if [ "$RUNNER_OS" = Windows ]; then exe=nsvim.exe; fi
            cp "target/$target/release/$exe" "$dir/"
            cp README.md LICENSE assets/editor.svg "$dir/"
            if [ "$RUNNER_OS" = Linux ]; then cp assets/editor.desktop "$dir/"; fi
            tar -czf "$dir.tar.gz" "$dir"
            shasum -a 256 "$dir.tar.gz" > "$dir.tar.gz.sha256"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: nsvim-*.tar.gz*

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
