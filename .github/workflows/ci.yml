name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Linux packages
        run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev pkg-config fonts-dejavu-core
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.1"
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Repeat flows_mouse (diagnostic)
        run: |
          cargo test --locked -p nsvim-native --test flows_mouse --no-run
          fails=0
          for i in $(seq 25); do
            if ! cargo test --locked -p nsvim-native --test flows_mouse -- --nocapture > out.txt 2>&1; then
              fails=$((fails+1)); echo "=== run $i FAILED"; grep -n "DIAG\|panicked\|FAILED" out.txt | cut -c1-6000
            else
              echo "=== run $i ok"; grep -n "DIAG" out.txt | head -5
            fi
          done
          echo "FAILS=$fails"
      - name: Format
        run: cargo fmt --all --check
      - name: Lint
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --locked

  # The app builds on each desktop it ships for. Tests run on Linux.
  check:
    name: check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.1"
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Lint
        run: cargo clippy --all-targets --locked -- -D warnings

  # scripts/install.sh and scripts/install.ps1 against local release fixtures. The release workflow runs them too.
  installer:
    name: installer (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Lint
        if: runner.os == 'Linux'
        run: shellcheck -s sh scripts/install.sh scripts/test-install.sh
      - name: Test with sh
        if: runner.os != 'Windows'
        run: scripts/test-install.sh
      - name: Test with bash
        if: runner.os != 'Windows'
        run: scripts/test-install.sh bash
      - name: Check the PowerShell syntax
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          foreach ($file in 'scripts/install.ps1', 'scripts/test-install.ps1') {
            $parseErrors = $null
            $tokens = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file), [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors) {
              $parseErrors | ForEach-Object { Write-Error "${file}: $($_.Message)" }
              exit 1
            }
          }
      - name: Test the Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/test-install.ps1
