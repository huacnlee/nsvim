[package]
name = "nsvim-native"
version = "0.2.0"
edition = "2024"
description = "nsvim's Rust: the app state, the workers and the views that Rust draws, as an nshm."
license = "MIT"
keywords = ["nshm"]
publish = false

# The program is nsvim. It runs the bundle of App.tsx with this crate's UI set, and it serves
# `ctl`, `mcp`, `--wait` and the open in a running editor, which NSH's own runner does not.
[[bin]]
name = "nsvim"
path = "src/main.rs"

# The terminal editor as its own console program, for Windows (`nsvim-tui.exe`). On macOS and
# Linux, `nsvim` in a terminal does the same.
[[bin]]
name = "nsvim-tui"
path = "src/tui_main.rs"

[dependencies]
editor = { package = "editor-core", path = "../../crates/editor-core" }
nsh-core = "0.7.0"
nsh-base = "0.7.0"
unicode-width = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
dirs = "6"
globset = "0.4"
similar = "2"
# The workers wake the engine thread through a tokio channel, which any executor can await.
tokio = { version = "1", default-features = false, features = ["sync"] }

# The workers that walk and watch the disk, and the log. The web build has none of them.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ignore = "0.4"
notify = "8"
# `nsvim` in a terminal: the same bundle and UI sets, drawn in the terminal.
nsh-tui-host = "0.7.0"
nsh-platform-tui = { version = "0.7.0", default-features = false, features = ["js", "run-app", "svg"] }

# The program's runner: it runs App.tsx's bundle with the app's Rust components.
[target.'cfg(target_os = "linux")'.dependencies]
nsh-platform-linux = { version = "0.7.0", default-features = false, features = ["svg"] }
nsh-linux-app = { version = "0.7.0", default-features = false, features = ["js", "svg"] }

[target.'cfg(target_os = "macos")'.dependencies]
nsh-platform-macos = { version = "0.7.0", default-features = false, features = ["svg"] }
nsh-macos-app = { version = "0.7.0", default-features = false, features = ["js", "svg"] }

[target.'cfg(target_os = "windows")'.dependencies]
nsh-platform-windows = { version = "0.7.0", default-features = false, features = ["svg"] }
nsh-windows-app = { version = "0.7.0", default-features = false, features = ["js", "svg"] }

[dev-dependencies]
nsh-engine = { version = "0.7.0", default-features = false }
# `bundle`: the tests build App.tsx and run it headless.
nsh-testing = { version = "0.7.0", default-features = false, features = ["bundle"] }
tempfile = "3"
